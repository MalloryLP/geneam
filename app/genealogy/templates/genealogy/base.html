{% load static %}<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Geneam{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'genealogy/css/style.css' %}">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{% url 'person-list' %}">Geneam</a>
        <nav>
            {% if user.is_authenticated %}
                <a href="{% url 'admin:index' %}">Admin</a>
                <form action="{% url 'logout' %}" method="post" class="inline-form">
                    {% csrf_token %}
                    <button type="submit">Déconnexion ({{ user.username }})</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Connexion</a>
            {% endif %}
        </nav>
    </header>
    <main class="container">
        {% for message in messages %}
            <div class="message">{{ message }}</div>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
