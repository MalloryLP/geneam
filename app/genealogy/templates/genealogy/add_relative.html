{% extends "genealogy/base.html" %}

{% block title %}{{ title }} — Geneam{% endblock %}

{% block content %}
    <p><a href="{% url 'person-detail' target.pk %}">&larr; Retour à {{ target.full_name }}</a></p>
    <h1>{{ title }}</h1>

    <section class="relative-form-section">
        <h2>{{ existing_label }}</h2>
        <form method="post" class="stacked-form">
            {% csrf_token %}
            <input type="hidden" name="mode" value="existing">
            {{ existing_form.as_p }}
            <button type="submit" class="btn btn-primary">Lier</button>
        </form>
    </section>

    <section class="relative-form-section">
        <h2>{{ new_label }}</h2>
        <form method="post" class="stacked-form">
            {% csrf_token %}
            <input type="hidden" name="mode" value="new">
            {{ new_form.as_p }}
            <button type="submit" class="btn btn-primary">Créer et lier</button>
        </form>
    </section>
{% endblock %}
